<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViewPost</title>
    <link rel="stylesheet" href="assets/main.css">
    <link rel="stylesheet" href="assets/viewpost.CSS">

</head>

<body>
    <template class="comment-template">
        <div class="comment-object">
            <span class="date-commented"></span>
            <!-- <p class="comment-text"></p> -->
        </div>
    </template>
    <!-- <header>
        <button onclick="window.location.href = './index.html'">Home</button>
    </header> -->
    <header>
        <div class="heading">
            <a href="./index.html">
                <h1>Luke's Blog</h1>
            </a>
        </div>
    </header>
    <main>
        <div class="main-post-wrapper">
            <div class="post-wrapper">
                <div class="post">
                    <div class="heading-and-date">
                        <h1></h1>
                        <span></span>
                    </div>
                    <!-- <hr> -->

                    <div class="paragraphs">
                        <!-- filled by javascript -->
                    </div>
                </div>
                <hr>
                <div class="comment-submission">
                    <form>
                        <textarea name="comment"></textarea>
                        <input type="submit" value="Comment">
                    </form>
                </div>
                <div class="comments"></div>
            </div>
        </div>
    </main>
    <script>
        const nlrgx = /\r\n|\n/g

        const post_id = new URLSearchParams(window.location.search).get("post_id")
        const form = document.querySelector(".comment-submission form")
        form.addEventListener('submit', function (e) {
            e.preventDefault()
            const text = form.querySelector("textarea").value
            if (text !== "") {
                postComment(post_id, text)
            }
        })

        function turnTextIntoSpans(text) {
            const spans = []
            const split = text.split(" ")
            const breakOn = 18;
            let queue = ""
            for (let i = 0; i < split.length; i++) {
                const word = split[i]
                if (word.length > breakOn) {
                    if (queue !== "") {
                        const span = document.createElement("span")
                        span.textContent = queue
                        spans.push(span)
                    }
                    const longSpan = document.createElement("span")
                    longSpan.classList.add("force-break")
                    longSpan.textContent = word + ((i < split.length - 1) ? " " : "")
                    spans.push(longSpan)
                    queue = "";
                } else {
                    queue += word
                    if (i < split.length - 1) {
                        queue += " "
                    }
                }
                // spans.push(span)
            }
            if (queue !== "") {
                const span = document.createElement("span")
                span.textContent = queue
                spans.push(span)
            }
            return spans
        }

        function displayPostHelper(postContent) {
            const splitParagraphs = postContent.split(nlrgx)
            for (const p of splitParagraphs) {
                const newP = document.createElement("p")
                newP.lang = "en"
                // newP.innerHTML = plantHyphensIntoReallyLongText(p)
                const spans = turnTextIntoSpans(p)
                spans.forEach(span => {
                    newP.append(span)
                })
                // newP.textContent = p
                document.querySelector(".post .paragraphs").append(newP)
            }
        }
        function displayPost(postObject) {
            document.querySelector(".post .heading-and-date h1").textContent = postObject.title
            document.querySelector(".post .heading-and-date span").textContent = new Date(`${postObject.date_posted}`).toLocaleDateString()
            // document.querySelector(".post p").textContent = postObject.body
            displayPostHelper(postObject.body)
        }
        function displayCommentHelper(commentContainerClone, commentContent) {
            const splitParagraphs = commentContent.split(nlrgx)
            for (const p of splitParagraphs) {
                const newP = document.createElement("p")
                // newP.textContent = p
                const spans = turnTextIntoSpans(p)
                spans.forEach(span => {
                    newP.append(span)
                })
                newP.classList.add("comment-text")
                commentContainerClone.append(newP)
            }
        }
        function displayComment(commentObject) {
            const template = document.querySelector(".comment-template")
            const commentContainerClone = template.content.cloneNode(true).querySelector("*")
            // commentContainerClone.querySelector(".comment-object .comment-text").textContent = commentObject.comment
            commentContainerClone.querySelector(".comment-object .date-commented").textContent = commentObject.date_commented
            displayCommentHelper(commentContainerClone, commentObject.comment)
            document.querySelector(".comments").append(commentContainerClone)
        }

        async function postComment(post_id, comment) {
            try {
                const formData = new FormData()
                formData.set("post_id", post_id)
                formData.set("comment", comment)
                const data = await fetch("http://localhost:3000/apis/postComment.php",
                    {
                        method: "POST",
                        body: formData
                    }
                )
                if (!data.ok) {
                    throw new Error(await data.text())
                }
                const response = await data.json()
                console.log(response)
                document.querySelector(".comments").querySelectorAll(":scope > *").forEach(e => e.remove())
                form.querySelector("textarea").value = ""
                getCommentsFromPostId(post_id)
            } catch (err) {
                throw new Error(err.message)
            }
        }


        async function getCommentsFromPostId(post_id) {
            try {
                const formData = new FormData()
                formData.set("post_id", post_id)
                const data = await fetch("http://localhost:3000/apis/getCommentsFromPostId.php",
                    {
                        method: "POST",
                        body: formData
                    }
                )
                if (!data.ok) {
                    throw new Error("fetch failed")
                }
                const response = await data.json()
                console.log(response)
                // displayComment(response)
                for (const comment of response.data) {
                    displayComment(comment)
                }
            } catch (err) {
                throw new Error(err.message)
            }
        }
        async function getPostFromId(post_id) {
            try {
                const formData = new FormData()
                formData.set("post_id", post_id)
                const data = await fetch("http://localhost:3000/apis/getPostFromId.php",
                    {
                        method: "POST",
                        body: formData
                    }
                )
                if (!data.ok) {
                    throw new Error("fetch failed")
                }
                const response = await data.json()
                console.log(response)
                displayPost(response.data)
            } catch (err) {
                displayPost({ title: "Error.", "body": "This post no longer exists." })
                throw new Error(err.message)
            }
        }
        if (post_id !== null) {
            getPostFromId(post_id)
            getCommentsFromPostId(post_id)
        } else {
            window.location.href = "./index.html"
        }
    </script>
</body>

</html>
